<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#FBF7F1">
<title>#ourfuds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%84%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #FBF7F1;
  --surface: #FFFFFF;
  --ink: #221C16;
  --ink-2: #6E645A;
  --ink-3: #A89E93;
  --line: rgba(34, 28, 22, .08);
  --accent: #FF6A3D;
  --accent-deep: #E8532A;
  --accent-soft: #FFEADF;
  --butter: #FFE08A;
  --radius-l: 1.5rem;
  --radius-m: 1.1rem;
  --radius-s: .8rem;
  --shadow-1: 0 1px 2px rgba(70, 45, 20, .05), 0 6px 18px rgba(70, 45, 20, .06);
  --shadow-2: 0 2px 6px rgba(70, 45, 20, .07), 0 22px 48px rgba(70, 45, 20, .12);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.2, 1.15, .35, 1);
  --pop: cubic-bezier(.3, 1.9, .5, 1);
  --gutter: clamp(1.1rem, 3.2vw, 2.6rem);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring: linear(0, .006, .025 2.8%, .101 6.1%, .539 18.9%, .721 25.3%, .849 31.5%, .937 38.1%, .968 41.8%, .991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1);
  }
}

* { box-sizing: border-box; }
html {
  font-size: clamp(15px, .9vw + 8.5px, 20px);
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus { outline: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Views & transitions ---------- */
.view {
  position: fixed;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  transition: transform .7s var(--spring), opacity .35s var(--ease), visibility 0s linear .7s;
}
.view[data-state="active"] {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}
#home[data-state="behind"] { transform: scale(.96); opacity: 0; visibility: hidden; }
#recipe { z-index: 2; }
#recipe[data-state="off"] { transform: translate3d(0, 3rem, 0); opacity: 0; visibility: hidden; }
.page {
  max-width: 76rem;
  margin: 0 auto;
  padding: 0 var(--gutter) 3rem;
}

/* ---------- Home ---------- */
.masthead {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.6rem 0 1.2rem;
}
.brand {
  font-family: var(--round);
  font-size: 2.1rem;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1;
}
.brand .hash {
  display: inline-block;
  color: var(--accent);
  margin-right: .04em;
  transform: rotate(-8deg);
  animation: wobble 1.2s var(--spring) .4s both;
}
@keyframes wobble {
  0% { transform: rotate(-8deg); }
  30% { transform: rotate(10deg) translateY(-.08em); }
  100% { transform: rotate(-8deg); }
}
.greeting {
  color: var(--ink-2);
  font-size: 1.05rem;
  padding-top: .35rem;
}
.masthead .spacer { flex: 1; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  min-height: 2.4rem;
  padding: 0 1rem;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 600;
  background: var(--butter);
  color: #5A4300;
}
.pill .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #D48A00; }
.pill[hidden] { display: none; }

.eyebrow {
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.section-head {
  display: flex;
  align-items: baseline;
  gap: .6rem;
  margin: 0 0 .9rem;
}
.section-title {
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -.02em;
}
.section-title .emoji { margin-right: .35rem; }
.section-count { color: var(--ink-3); font-size: .95rem; font-weight: 600; }

.hero-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1rem;
}
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  transition: transform .5s var(--spring), box-shadow .3s var(--ease);
  animation: rise .7s var(--spring) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.card:active, .tile:active { transform: scale(.965); box-shadow: var(--shadow-2); transition-duration: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(1rem); } }
.card .art { aspect-ratio: 4 / 3; }
.card .body { padding: .85rem 1rem 1rem; display: flex; flex-direction: column; gap: .3rem; flex: 1; }
.card .title {
  font-size: 1.08rem;
  font-weight: 700;
  letter-spacing: -.015em;
  line-height: 1.22;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.meta { color: var(--ink-2); font-size: .85rem; font-variant-numeric: tabular-nums; }
.pin {
  position: absolute;
  top: .7rem;
  right: .7rem;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .92);
  color: var(--accent);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
}
.pin svg { width: 1.05rem; height: 1.05rem; }

.art {
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: linear-gradient(145deg, hsl(var(--hue, 24) 95% 90%), hsl(calc(var(--hue, 24) + 28) 90% 82%));
}
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art .glyph {
  font-size: 3.2rem;
  line-height: 1;
  transform: rotate(-7deg);
  filter: drop-shadow(0 6px 10px rgba(80, 40, 10, .15));
}
.art .glyph.letter {
  font-family: var(--round);
  font-weight: 800;
  color: rgba(255, 255, 255, .95);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: .55rem;
  margin: 1.6rem 0 .4rem;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 2.75rem;
  padding: 0 1.1rem;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line);
  font-size: .92rem;
  font-weight: 600;
  transition: transform .4s var(--spring), background .2s;
}
.chip:active { transform: scale(.94); background: var(--accent-soft); }

.category { padding-top: 2rem; }
.tile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr));
  gap: .85rem;
}
.tile {
  display: flex;
  align-items: center;
  gap: 1rem;
  width: 100%;
  min-height: 5.2rem;
  padding: .7rem 1rem .7rem .7rem;
  text-align: left;
  background: var(--surface);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-1);
  transition: transform .5s var(--spring), box-shadow .3s var(--ease);
  animation: rise .7s var(--spring) both;
  animation-delay: calc(var(--i, 0) * 30ms);
}
.tile .art { width: 3.9rem; height: 3.9rem; flex: none; border-radius: var(--radius-s); }
.tile .art .glyph { font-size: 1.9rem; }
.tile .text { min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
.tile .title { font-size: 1.02rem; font-weight: 650; letter-spacing: -.01em; line-height: 1.25; }
.tile .pin-inline { color: var(--accent); margin-left: .3rem; vertical-align: -.1em; }
.tile .pin-inline svg { width: .9rem; height: .9rem; }

.empty-note {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.1rem 1.3rem;
  border-radius: var(--radius-m);
  border: 2px dashed rgba(34, 28, 22, .1);
  color: var(--ink-2);
}
.empty-note .glyph { font-size: 1.8rem; opacity: .55; transform: rotate(-10deg); }
.empty-note strong { display: block; color: var(--ink); font-weight: 650; }
.empty-note span { font-size: .88rem; }

.footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .8rem;
  margin-top: 3rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--line);
  color: var(--ink-3);
  font-size: .85rem;
}
.link-button {
  min-height: 2.75rem;
  padding: 0 1rem;
  border-radius: 999px;
  font-weight: 600;
  color: var(--ink-2);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: transform .4s var(--spring);
}
.link-button:active { transform: scale(.95); }

.state-screen {
  min-height: 80vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: .8rem;
  text-align: center;
  padding: 2rem;
}
.state-screen .big { font-size: 4rem; animation: bob 2.4s ease-in-out infinite; }
.state-screen h1 { font-size: 1.6rem; letter-spacing: -.02em; }
.state-screen p { color: var(--ink-2); max-width: 28rem; }
@keyframes bob { 50% { transform: translateY(-.4rem) rotate(4deg); } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .55rem;
  min-height: 3.3rem;
  padding: 0 1.4rem;
  border-radius: 999px;
  font-weight: 700;
  font-size: 1rem;
  background: var(--surface);
  box-shadow: var(--shadow-1);
  transition: transform .45s var(--spring), background .2s;
}
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(255, 106, 61, .32); }
.btn.primary:active { background: var(--accent-deep); }
.btn svg { width: 1.25rem; height: 1.25rem; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 3.3rem;
  height: 3.3rem;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-1);
  transition: transform .45s var(--spring);
}
.icon-btn:active { transform: scale(.9); }
.icon-btn svg { width: 1.4rem; height: 1.4rem; }
.icon-btn:disabled { opacity: .35; }

/* ---------- Recipe ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: .8rem;
  padding: 1rem var(--gutter);
  background: linear-gradient(var(--bg) 70%, rgba(251, 247, 241, 0));
}
.topbar .spacer { flex: 1; }
.r-hero {
  display: flex;
  align-items: center;
  gap: 1.8rem;
  padding: .4rem 0 1.8rem;
}
.r-hero .art { width: 12rem; aspect-ratio: 4 / 3; flex: none; border-radius: var(--radius-l); box-shadow: var(--shadow-1); }
.r-hero .art .glyph { font-size: 4rem; }
.r-hero h1 {
  font-size: clamp(1.9rem, 3.6vw, 2.6rem);
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1.08;
  margin: .35rem 0 .7rem;
  -webkit-user-select: text;
  user-select: text;
}
.facts { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; color: var(--ink-2); font-size: .95rem; }
.facts b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .8rem; }
.tag { padding: .25rem .7rem; border-radius: 999px; background: var(--accent-soft); color: #A8431F; font-size: .78rem; font-weight: 600; }

.r-body {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: 1.4rem;
  align-items: start;
}
.panel {
  background: var(--surface);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-1);
  padding: 1.4rem 1.5rem 1.5rem;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 3.3rem;
  margin-bottom: .6rem;
}
.panel-head h2 { font-size: 1.3rem; letter-spacing: -.02em; }

.scaler { display: flex; align-items: center; gap: .5rem; }
.scaler .icon-btn { width: 2.9rem; height: 2.9rem; box-shadow: inset 0 0 0 1px var(--line); background: var(--bg); }
.scaler .value {
  min-width: 5.6rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.scaler .value b { display: block; font-family: var(--round); font-size: 1.35rem; }
.scaler .value span { font-size: .72rem; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.scaler .value.changed b { color: var(--accent); }

.ing-list { display: flex; flex-direction: column; }
.ing {
  display: grid;
  grid-template-columns: 2.1rem minmax(4.6rem, auto) 1fr;
  align-items: center;
  column-gap: .9rem;
  width: 100%;
  min-height: 3.4rem;
  padding: .45rem 0;
  text-align: left;
  font-size: 1.02rem;
  border-bottom: 1px solid var(--line);
}
.ing-list li:last-child .ing { border-bottom: 0; }
.ing .box {
  position: relative;
  width: 2.1rem;
  height: 2.1rem;
  border-radius: .7rem;
  border: 2px solid rgba(34, 28, 22, .18);
  display: grid;
  place-items: center;
  transition: background .25s var(--ease), border-color .25s var(--ease);
}
.ing .box svg { width: 1.2rem; height: 1.2rem; color: #fff; }
.ing .box svg path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s var(--ease) .06s; }
.ing .box::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  pointer-events: none;
}
.ing .qty {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: color .3s var(--ease), opacity .3s var(--ease);
}
.ing .qty.scaled { color: var(--accent); }
.ing .item { transition: opacity .3s var(--ease); }
.ing .item > span {
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 0 55%;
  background-size: 0% 2px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  transition: background-size .4s var(--ease);
}
.ing.no-qty { grid-template-columns: 2.1rem 1fr; }
.ing.is-checked .box { background: var(--accent); border-color: var(--accent); animation: pop .5s var(--pop); }
.ing.is-checked .box svg path { stroke-dashoffset: 0; }
.ing.is-checked .box::after { animation: ring .6s var(--ease); }
.ing.is-checked .qty, .ing.is-checked .item { opacity: .42; }
.ing.is-checked .qty.scaled { color: inherit; }
.ing.is-checked .item > span { background-size: 100% 2px; }
@keyframes pop { 0% { transform: scale(.72); } 100% { transform: scale(1); } }
@keyframes ring {
  0% { box-shadow: 0 0 0 0 rgba(255, 106, 61, .45); }
  100% { box-shadow: 0 0 0 .8rem rgba(255, 106, 61, 0); }
}
.ing-progress {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1rem;
  color: var(--ink-3);
  font-size: .88rem;
  font-weight: 600;
  min-height: 2.75rem;
}
.ing-progress.done { color: var(--accent-deep); }
.ing-progress.done .msg { animation: wobble 1s var(--spring); display: inline-block; }

.steps { counter-reset: step; display: flex; flex-direction: column; gap: .2rem; }
.step {
  display: grid;
  grid-template-columns: 2.4rem 1fr;
  gap: 1rem;
  width: 100%;
  padding: .75rem .6rem .75rem 0;
  text-align: left;
  font-size: 1.05rem;
  line-height: 1.5;
  border-radius: var(--radius-s);
  transition: background .2s var(--ease), transform .45s var(--spring);
}
.step:active { background: var(--accent-soft); transform: scale(.985); }
.step .n {
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--round);
  font-weight: 800;
  font-size: 1rem;
  background: var(--accent-soft);
  color: var(--accent-deep);
  margin-top: -.1rem;
}
.hint { color: var(--ink-3); font-size: .8rem; font-weight: 600; }
.notes {
  margin-top: 1.2rem;
  padding: 1.1rem 1.3rem;
  border-radius: var(--radius-m);
  background: #FFF6D9;
  color: #5B4A1C;
  font-size: .98rem;
  line-height: 1.5;
}
.notes .eyebrow { color: #B08A22; display: block; margin-bottom: .3rem; }

/* ---------- Cooking mode ---------- */
.cook {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: #1E1814;
  color: #FFF4E6;
  transform: translate3d(0, 100%, 0);
  visibility: hidden;
  transition: transform .75s var(--spring), visibility 0s linear .75s;
}
.cook.open { transform: none; visibility: visible; transition-delay: 0s; }
.cook-top {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.1rem var(--gutter) 0;
}
.cook-top .title { font-weight: 650; color: rgba(255, 244, 230, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cook-top .spacer { flex: 1; }
.cook .icon-btn, .cook .btn { background: rgba(255, 255, 255, .09); color: #FFF4E6; box-shadow: none; }
.wake { font-size: .8rem; font-weight: 600; color: rgba(255, 244, 230, .45); display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; }
.wake.on { color: #FFD27A; }
.wake svg { width: 1rem; height: 1rem; }
.cook-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 1rem calc(var(--gutter) + 1rem);
  overflow: hidden;
  min-height: 0;
}
.cook-stage .eyebrow { color: var(--accent); font-size: .95rem; margin-bottom: 1rem; }
.step-text {
  font-size: 2.6rem;
  font-weight: 650;
  line-height: 1.28;
  letter-spacing: -.02em;
  max-width: 60rem;
  overflow-wrap: break-word;
}
.step-text.in-next { animation: stepNext .6s var(--spring); }
.step-text.in-prev { animation: stepPrev .6s var(--spring); }
@keyframes stepNext { from { opacity: 0; transform: translate3d(3rem, 0, 0); } }
@keyframes stepPrev { from { opacity: 0; transform: translate3d(-3rem, 0, 0); } }
.finish { text-align: center; display: grid; justify-items: center; gap: 1rem; animation: stepNext .6s var(--spring); }
.finish .big { font-size: 5rem; animation: bob 2.4s ease-in-out infinite; }
.finish h2 { font-size: 2.6rem; letter-spacing: -.03em; }
.finish p { color: rgba(255, 244, 230, .6); font-size: 1.2rem; }
.cook-bottom { padding: 0 var(--gutter) 1.4rem; }
.segments { display: flex; gap: .35rem; margin-bottom: 1.1rem; }
.segments i { flex: 1; height: .35rem; border-radius: 999px; background: rgba(255, 255, 255, .12); transition: background .35s var(--ease); }
.segments i.on { background: var(--accent); }
.cook-nav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 1rem; }
.cook-nav .btn { min-height: 5.4rem; font-size: 1.5rem; border-radius: 1.6rem; }
.cook-nav .btn svg { width: 1.8rem; height: 1.8rem; }
.cook-nav .btn.primary { background: var(--accent); color: #fff; box-shadow: none; }
.cook-nav .btn:disabled { opacity: .3; }

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  width: min(30rem, 92vw);
  display: flex;

    var usage = fetchJSON('usage.json').catch(function () { return {}; });
    var recipes = fetchJSON('recipes.json');
    Promise.all([usage.then(function (snap) { return UsageStore.init(backend, snap); }).catch(function () {}), recipes])
      .then(function (results) {
        state.data = normalise(results[1]);
        state.byId = Object.create(null);
        state.data.recipes.forEach(function (r) { state.byId[r.id] = r; });
        renderHome();
        if (!routing) { routing = true; window.addEventListener('hashchange', route); }
        route();
      })
      .catch(function (err) {
        $home.replaceChildren(stateScreen('🥄', 'We couldn’t open the recipe box',
          (err && err.message ? err.message + '. ' : '') + 'Check your connection, or that recipes.json is valid.',
          h('button', { class: 'btn primary', type: 'button', onclick: boot }, 'Try again')));
      });
  }
  boot();
})();
</script>
</body>
</html>
